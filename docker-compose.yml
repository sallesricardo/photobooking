services:
  db:
    image: postgres:16-alpine
    container_name: photobooking-db
    environment:
      POSTGRES_DB: photobooking
      POSTGRES_USER: photobooking
      POSTGRES_PASSWORD: photobooking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photobooking -d photobooking"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: photobooking-backend
    environment:
      DATABASE_URL: postgresql+psycopg://photobooking:photobooking@db:5432/photobooking
    ports:
      - "8008:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: photobooking-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
