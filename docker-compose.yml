services:
  db:
    image: postgres:16-alpine
    container_name: photobooking-db
    environment:
      POSTGRES_DB: photobooking
      POSTGRES_USER: photobooking
      POSTGRES_PASSWORD: photobooking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photobooking -d photobooking"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: photobooking-backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://photobooking:photobooking@db:5432/photobooking}
      CALENDAR_PROVIDER: ${CALENDAR_PROVIDER:-mock}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-change-me-in-production}
      WHATSAPP_PHONE: ${WHATSAPP_PHONE:-5511999999999}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-admin}
      ADMIN_SESSION_MINUTES: ${ADMIN_SESSION_MINUTES:-60}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-false}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-60}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/v1/google/callback}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-primary}
      GOOGLE_TOKEN_PATH: ${GOOGLE_TOKEN_PATH:-/app/data/google_token.json}
    ports: 
      - "8000:8000"
    volumes:
      - "./backend:/app"
      - "google_token:/app/data"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: photobooking-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8000}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
  google_token:
